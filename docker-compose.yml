# Local development:   docker compose up -d db      (Postgres only; run apps with `pnpm dev`)
# Full stack in Docker: docker compose --profile full up --build
#
# Secrets come from a root `.env` file (see .env.example); nothing sensitive is committed.

name: zentro

x-app-env: &app-env
  DATABASE_URL: postgres://zentro:${POSTGRES_PASSWORD:-zentro}@db:5432/zentro
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ chars) in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
  NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
  RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
  AUTHENTICATOR_INTERNAL_URL: http://authenticator:3001

x-app-build: &app-build
  context: .
  args:
    NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    NEXT_PUBLIC_AUTHENTICATOR_URL: ${NEXT_PUBLIC_AUTHENTICATOR_URL:-http://localhost:3001}
    AUTHENTICATOR_INTERNAL_URL: http://authenticator:3001

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zentro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentro}
      POSTGRES_DB: zentro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zentro -d zentro"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [full]
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://zentro:${POSTGRES_PASSWORD:-zentro}@db:5432/zentro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  authenticator:
    profiles: [full]
    build:
      <<: *app-build
      args:
        APP: authenticator
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTHENTICATOR_URL: ${NEXT_PUBLIC_AUTHENTICATOR_URL:-http://localhost:3001}
        AUTHENTICATOR_INTERNAL_URL: http://authenticator:3001
    environment:
      <<: *app-env
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [full]
    build:
      <<: *app-build
      args:
        APP: web
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTHENTICATOR_URL: ${NEXT_PUBLIC_AUTHENTICATOR_URL:-http://localhost:3001}
        AUTHENTICATOR_INTERNAL_URL: http://authenticator:3001
    environment:
      <<: *app-env
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - authenticator

  tasks:
    profiles: [full]
    build:
      <<: *app-build
      args:
        APP: tasks
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_AUTHENTICATOR_URL: ${NEXT_PUBLIC_AUTHENTICATOR_URL:-http://localhost:3001}
        AUTHENTICATOR_INTERNAL_URL: http://authenticator:3001
    environment:
      <<: *app-env
      PORT: "3002"
    ports:
      - "3002:3002"
    depends_on:
      - authenticator

volumes:
  pgdata:
